name: Daily TrendForce Price Report

on:
  schedule:
    # 07:30 Asia/Taipei = 23:30 UTC on the previous calendar day.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and email report
        env:
          REPORT_RECIPIENT: w0617w0617@gmail.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
        run: python src/trendforce_report.py --send-email

      - name: Commit generated snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history reports
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "chore: add daily TrendForce price report"
            git push
          fi
