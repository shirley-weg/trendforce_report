name: Daily TrendForce Price Report

on:
  schedule:
    # 07:30 Asia/Taipei is 23:30 UTC on the previous day.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: w0617w0617@gmail.com
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and email report
        run: >
          python src/trendforce_report.py
          --history data/trendforce_history.json
          --report-html reports/latest.html
          --report-md reports/latest.md
          --save-history
          --send-email

      - name: Commit updated history and latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trendforce_history.json reports/latest.html reports/latest.md
          git diff --staged --quiet || git commit -m "Update TrendForce daily report"
          git push
